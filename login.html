<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CS Hub</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #080c11;
            color: #e6edf3;
            font-family: Inter, Arial, sans-serif;
        }

        .card {
            width: min(420px, 92vw);
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
        }

        p {
            margin: 0 0 20px;
            color: #8b98a8;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 0 0 6px;
            font-size: .9rem;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .08);
            background: #111820;
            color: #e6edf3;
            margin-bottom: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px 14px;
            border: 0;
            border-radius: 10px;
            background: #2ecc71;
            color: #080c11;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 18px 0 18px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .10);
            background: #111820;
            color: #e6edf3;
            font-weight: 700;
            text-decoration: none;
            transition: all .2s ease;
            box-sizing: border-box;
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .social-btn:hover {
            background: #18212c;
            border-color: rgba(46, 204, 113, .35);
        }

        .social-btn.google {
            border-color: rgba(255, 255, 255, .12);
        }

        .social-btn.discord {
            border-color: rgba(88, 101, 242, .35);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0;
            color: #6f7d8d;
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, .08);
        }

        .links {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        a {
            color: #2ecc71;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Entrar no CS Hub</h1>
        <p>Esta é a área de login provisória da fase de testes. Em breve ela será integrada ao fluxo final da
            plataforma.</p>

        <div class="social-login">
            <a class="social-btn google" href="/auth/google">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#EA4335"
                        d="M12 10.2v3.9h5.4c-.2 1.3-1.6 3.9-5.4 3.9-3.2 0-5.9-2.7-5.9-6s2.7-6 5.9-6c1.8 0 3 .8 3.7 1.4l2.5-2.4C16.6 3.5 14.5 2.5 12 2.5 6.8 2.5 2.6 6.7 2.6 12S6.8 21.5 12 21.5c6.9 0 9.1-4.8 9.1-7.3 0-.5 0-.9-.1-1.3H12z" />
                    <path fill="#34A853"
                        d="M3.7 7.3l3.2 2.3C7.8 7.8 9.7 6.5 12 6.5c1.8 0 3 .8 3.7 1.4l2.5-2.4C16.6 3.5 14.5 2.5 12 2.5 8.4 2.5 5.3 4.5 3.7 7.3z" />
                    <path fill="#FBBC05"
                        d="M12 21.5c2.4 0 4.5-.8 6-2.3l-2.8-2.3c-.8.6-1.8 1.1-3.2 1.1-3.8 0-5.2-2.6-5.4-3.9l-3.2 2.5c1.6 3 4.8 4.9 8.6 4.9z" />
                    <path fill="#4285F4"
                        d="M21.1 12.9c.1-.4.1-.8.1-1.3s0-.9-.1-1.3H12v3.9h5.4c-.3 1.5-1.3 2.7-2.6 3.4l2.8 2.3c1.6-1.5 3.5-4.2 3.5-7z" />
                </svg>
                <span>Entrar com Google</span>
            </a>

            <a class="social-btn discord" href="/auth/discord">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#5865F2"
                        d="M20.3 4.4A16.7 16.7 0 0 0 16.2 3a11.5 11.5 0 0 0-.5 1c-2.2-.3-4.4-.3-6.5 0a11.5 11.5 0 0 0-.5-1 16.7 16.7 0 0 0-4.1 1.4C2 8.1 1.3 11.6 1.6 15c1.7 1.3 3.3 2 4.9 2.5.4-.5.8-1.1 1.1-1.7-.6-.2-1.1-.5-1.6-.8l.4-.3c3.1 1.5 6.5 1.5 9.5 0l.4.3c-.5.3-1 .6-1.6.8.3.6.7 1.2 1.1 1.7 1.6-.5 3.2-1.2 4.9-2.5.4-3.9-.7-7.4-2.4-10.6zM9 13.2c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8c.9 0 1.6.8 1.6 1.8S9.9 13.2 9 13.2zm6 0c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8c.9 0 1.6.8 1.6 1.8S15.9 13.2 15 13.2z" />
                </svg>
                <span>Entrar com Discord</span>
            </a>
        </div>


        <div class="links">
            <a href="signup.html">Criar conta</a>
            <a href="index.html">Voltar para a home</a>
        </div>
    </div>
</body>

</html>
