<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — CS Hub</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #080c11;
            color: #e6edf3;
            font-family: Inter, Arial, sans-serif;
        }

        .card {
            width: min(460px, 92vw);
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.6rem;
        }

        p {
            margin: 0 0 20px;
            color: #8b98a8;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 0 0 6px;
            font-size: .9rem;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .08);
            background: #111820;
            color: #e6edf3;
            margin-bottom: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px 14px;
            border: 0;
            border-radius: 10px;
            background: #2ecc71;
            color: #080c11;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .links {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        a {
            color: #2ecc71;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Criar conta no CS Hub</h1>
        <p>Esta é a área provisória de cadastro da fase de testes. Em breve ela será integrada ao fluxo final da
            plataforma.</p>

        <label for="nome">Nome</label>
        <input id="nome" type="text" placeholder="Seu nome completo">

        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seuemail@exemplo.com">

        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Crie uma senha">

        <label for="confirmar">Confirmar senha</label>
        <input id="confirmar" type="password" placeholder="Repita sua senha">

        <button class="btn">Criar conta</button>

        <div class="links">
            <a href="login.html">Já tenho conta</a>
            <a href="index.html">Voltar para a home</a>
        </div>
    </div>
</body>

</html>
